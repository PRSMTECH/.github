# =============================================================================
# PrsmTechInc Reusable Release Workflow
# =============================================================================
# Purpose: Create releases with changelogs and Slack announcements
# Triggers: workflow_call (reusable from any PRSMTECH repo)
#
# This workflow performs:
#   - Git tag creation (v{version})
#   - GitHub Release with auto-generated changelog
#   - Slack notification via Bot API (chat.postMessage)
#
# Usage from calling workflow:
#   jobs:
#     release:
#       uses: PrsmTechInc/.github/.github/workflows/release-reusable.yml@main
#       with:
#         version: "3.0.5"
#         project_name: "Double View iOS"
#       secrets:
#         SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
# =============================================================================

name: Release

on:
  workflow_call:
    inputs:
      version:
        description: 'Semver version (e.g. 3.0.5)'
        required: true
        type: string
      release_notes:
        description: 'Custom release notes (auto-generates from commits if empty)'
        required: false
        type: string
        default: ''
      slack_channel_id:
        description: 'Slack channel ID for announcement'
        required: false
        type: string
        default: 'C0ARPUFUY0M'
      project_name:
        description: 'Project display name (e.g. Double View iOS)'
        required: true
        type: string
    secrets:
      SLACK_BOT_TOKEN:
        required: true

permissions:
  contents: write

jobs:
  # ===========================================================================
  # Create Git Tag
  # ===========================================================================
  create-tag:
    name: Create Tag
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        run: |
          TAG="v${{ inputs.version }}"
          echo "Creating tag: ${TAG}"

          # Check if tag already exists
          if git rev-parse "${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists, skipping creation"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
            echo "Tag ${TAG} created and pushed"
          fi

  # ===========================================================================
  # Create GitHub Release
  # ===========================================================================
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: create-tag
    outputs:
      release_url: ${{ steps.release.outputs.url }}
      release_body: ${{ steps.release.outputs.body }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          TITLE="${{ inputs.project_name }} ${TAG}"

          if [ -n "${{ inputs.release_notes }}" ]; then
            # Use custom release notes
            RELEASE_URL=$(gh release create "${TAG}" \
              --title "${TITLE}" \
              --notes "${{ inputs.release_notes }}" \
              2>&1 | tail -1)
            echo "body<<BODY_EOF" >> $GITHUB_OUTPUT
            echo "${{ inputs.release_notes }}" >> $GITHUB_OUTPUT
            echo "BODY_EOF" >> $GITHUB_OUTPUT
          else
            # Auto-generate changelog from commits
            RELEASE_URL=$(gh release create "${TAG}" \
              --title "${TITLE}" \
              --generate-notes \
              2>&1 | tail -1)
            # Fetch the auto-generated body
            BODY=$(gh release view "${TAG}" --json body -q '.body')
            echo "body<<BODY_EOF" >> $GITHUB_OUTPUT
            echo "${BODY}" >> $GITHUB_OUTPUT
            echo "BODY_EOF" >> $GITHUB_OUTPUT
          fi

          echo "url=${RELEASE_URL}" >> $GITHUB_OUTPUT
          echo "Release created: ${RELEASE_URL}"

  # ===========================================================================
  # Notify Slack
  # ===========================================================================
  notify-slack:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: create-release

    steps:
      - name: Post release announcement to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: |
          RELEASE_URL="${{ needs.create-release.outputs.release_url }}"
          RELEASE_BODY="${{ needs.create-release.outputs.release_body }}"

          # Build the message text (ASCII only)
          MESSAGE="*${{ inputs.project_name }} v${{ inputs.version }} Released*
          Branch: main
          Release: ${RELEASE_URL}"

          if [ -n "${RELEASE_BODY}" ]; then
            MESSAGE="${MESSAGE}
          ${RELEASE_BODY}"
          fi

          # Post via Slack Bot API
          curl -s -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg channel "${{ inputs.slack_channel_id }}" \
              --arg text "${MESSAGE}" \
              '{channel: $channel, text: $text, unfurl_links: false}'
            )"

          echo "Slack notification sent to channel ${{ inputs.slack_channel_id }}"
